  # --------------------
  # Model Serving + Frontend
  # --------------------
  model-serving:
    build:
      context: .
      dockerfile: docker/serving/Dockerfile
    image: polyhorizon-serving:local
    container_name: model-serving
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MLFLOW_TRACKING_URI: http://mlflow:5000
      FEAST_REPO_PATH: /app/polyhorizon/features/feature_repo
      FEAST_STORE_YAML: /app/polyhorizon/features/feature_repo/feature_store.yaml
      SERVING_CONFIG_PATH: /app/polyhorizon/serving/configs/serving_config.yaml
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      MLFLOW_S3_ENDPOINT_URL: http://seaweedfs-s3:8333
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      seaweedfs-bucket-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/v1/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [ml-platform]

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${FRONTEND_API_BASE_URL:-http://localhost:8000}
    image: polyhorizon-frontend:local
    container_name: polyhorizon-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      model-serving:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [ml-platform]


