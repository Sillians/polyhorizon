networks:
  ml-platform:
    external: true

volumes:
  traefik_data:
  postgres_data:
  postgres_backups:
  zookeeper-data:
  zookeeper-logs:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  seaweedfs-master-data:
  seaweedfs-volume-data:
  seaweedfs-filer-data:
  redis_data:
  grafana_data:
  prefect_data:
  spark_checkpoints:
  prometheus_data:
  alertmanager_data:
  loki_data:
  alloy_data:
  pushgateway_data:

services:
  # --------------------
  # PostgreSQL
  # --------------------
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--data-checksums --auth-host=scram-sha-256"

      APP_DB: ${POSTGRES_APP_DB}
      APP_USER: ${POSTGRES_APP_USER}
      APP_PASSWORD: ${POSTGRES_APP_PASSWORD}

      MLFLOW_DB: ${POSTGRES_MLFLOW_DB}
      MLFLOW_USER: ${POSTGRES_MLFLOW_USER}
      MLFLOW_PASSWORD: ${POSTGRES_MLFLOW_PASSWORD}

      FEAST_DB: ${POSTGRES_FEAST_DB}
      FEAST_USER: ${POSTGRES_FEAST_USER}
      FEAST_PASSWORD: ${POSTGRES_FEAST_PASSWORD}
      FEAST_SCHEMA: ${FEAST_SCHEMA}
      FEAST_REGISTRY_DB: ${POSTGRES_FEAST_REGISTRY_DB}
      FEAST_REGISTRY_USER: ${POSTGRES_FEAST_REGISTRY_USER}
      FEAST_REGISTRY_PASSWORD: ${POSTGRES_FEAST_REGISTRY_PASSWORD}
      FEAST_REGISTRY_SCHEMA: ${FEAST_REGISTRY_SCHEMA}

      PREFECT_DB: ${POSTGRES_PREFECT_DB}
      PREFECT_USER: ${POSTGRES_PREFECT_USER}
      PREFECT_PASSWORD: ${POSTGRES_PREFECT_PASSWORD}
      POSTGRES_MONITOR_USER: ${POSTGRES_MONITOR_USER}
      POSTGRES_MONITOR_PASSWORD: ${POSTGRES_MONITOR_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=150
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=1s
      - -c
      - track_io_timing=on
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres && psql -U postgres -d postgres -tAc 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ml-platform]

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_MONITOR_USER}:${POSTGRES_MONITOR_PASSWORD}@postgres:5432/postgres?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks: [ml-platform]

  postgres-backup:
    image: postgres:15-alpine
    profiles: [operations]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_BACKUP_DATABASES: ${POSTGRES_APP_DB},${POSTGRES_MLFLOW_DB},${POSTGRES_FEAST_DB},${POSTGRES_FEAST_REGISTRY_DB},${POSTGRES_PREFECT_DB}
      POSTGRES_BACKUP_RETENTION_DAYS: ${POSTGRES_BACKUP_RETENTION_DAYS:-14}
    volumes:
      - postgres_backups:/backups
      - ./scripts/postgres:/scripts:ro
    entrypoint: ["bash", "/scripts/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [ml-platform]

  # --------------------
  # Zookeeper + Kafka
  # --------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.10
    hostname: zookeeper
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=stat,ruok"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo stat | nc localhost 2181 | grep Mode"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ml-platform]

  kafka-broker-1:
    image: confluentinc/cp-kafka:7.4.10
    hostname: kafka-broker-1
    container_name: kafka-broker-1
    restart: unless-stopped
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_ZOOKEEPER_SESSION_TIMEOUT_MS: 18000
      KAFKA_ZOOKEEPER_CONNECTION_TIMEOUT_MS: 18000
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-broker-1:29092
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: ${TOPIC_PARTITIONS}
      KAFKA_DEFAULT_REPLICATION_FACTOR: ${TOPIC_REPLICATION_FACTOR}
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: kafka-broker-1
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    networks: [ml-platform]
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "kafka-topics", "--bootstrap-server", "kafka-broker-1:29092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 3

  kafka-broker-2:
    image: confluentinc/cp-kafka:7.4.10
    hostname: kafka-broker-2
    container_name: kafka-broker-2
    restart: unless-stopped
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_ZOOKEEPER_SESSION_TIMEOUT_MS: 18000
      KAFKA_ZOOKEEPER_CONNECTION_TIMEOUT_MS: 18000
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-broker-2:29093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: ${TOPIC_PARTITIONS}
      KAFKA_DEFAULT_REPLICATION_FACTOR: ${TOPIC_REPLICATION_FACTOR}
      KAFKA_JMX_PORT: 9102
      KAFKA_JMX_HOSTNAME: kafka-broker-2
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    networks: [ml-platform]
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "kafka-topics", "--bootstrap-server", "kafka-broker-2:29093", "--list"]
      interval: 10s
      timeout: 5s
      retries: 3

  kafka-broker-3:
    image: confluentinc/cp-kafka:7.4.10
    hostname: kafka-broker-3
    container_name: kafka-broker-3
    restart: unless-stopped
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_ZOOKEEPER_SESSION_TIMEOUT_MS: 18000
      KAFKA_ZOOKEEPER_CONNECTION_TIMEOUT_MS: 18000
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-broker-3:29094
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29094
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: ${TOPIC_PARTITIONS}
      KAFKA_DEFAULT_REPLICATION_FACTOR: ${TOPIC_REPLICATION_FACTOR}
      KAFKA_JMX_PORT: 9103
      KAFKA_JMX_HOSTNAME: kafka-broker-3
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    networks: [ml-platform]
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "kafka-topics", "--bootstrap-server", "kafka-broker-3:29094", "--list"]
      interval: 10s
      timeout: 5s
      retries: 3

  kafka-init:
    image: confluentinc/cp-kafka:7.4.10
    container_name: kafka-init
    volumes:
      - ./scripts/kafka/init-kafka.sh:/data/init-kafka.sh
    networks: [ml-platform]
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      chmod +x /data/init-kafka.sh
      /data/init-kafka.sh
      "
    depends_on:
      kafka-broker-1:
        condition: service_healthy
      kafka-broker-2:
        condition: service_healthy
      kafka-broker-3:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka-broker-1:29092,kafka-broker-2:29093,kafka-broker-3:29094"
      TOPIC_PARTITIONS: ${TOPIC_PARTITIONS}
      TOPIC_REPLICATION_FACTOR: ${TOPIC_REPLICATION_FACTOR}
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"

  schema-registry:
    image: confluentinc/cp-schema-registry:7.4.10
    container_name: schema-registry
    environment:
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka-broker-1:29092
    networks: [ml-platform]
    depends_on:
      kafka-broker-1:
        condition: service_healthy

  # -------------------------
  # SeaweedFS (S3-compatible)
  # -------------------------
  master:
    image: ${SEAWEEDFS_IMAGE}
    container_name: seaweedfs-master
    command: >
      master
      -ip=master
      -mdir=/data
      -defaultReplication=000
    volumes:
      - seaweedfs-master-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9333/cluster/status"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [ml-platform]

  volume:
    image: ${SEAWEEDFS_IMAGE}
    container_name: seaweedfs-volume
    depends_on:
      master:
        condition: service_healthy
    command: >
      volume
      -mserver=master:9333
      -dir=/data
      -max=50
    volumes:
      - seaweedfs-volume-data:/data
    restart: unless-stopped
    networks: [ml-platform]

  filer:
    image: ${SEAWEEDFS_IMAGE}
    container_name: seaweedfs-filer
    depends_on:
      master:
        condition: service_healthy
    command: >
      filer
      -master=master:9333
    volumes:
      - seaweedfs-filer-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [ml-platform]

  seaweedfs-s3:
    image: ${SEAWEEDFS_IMAGE}
    container_name: seaweedfs-s3
    depends_on:
      filer:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/entrypoint_s3.sh"]
    networks: [ml-platform]
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      - ./scripts/seaweedfs/entrypoint_s3.sh:/entrypoint_s3.sh:ro
    restart: unless-stopped

  seaweedfs-bucket-init:
    image: python:3.11-slim
    restart: "no"
    depends_on:
      seaweedfs-s3:
        condition: service_started
    networks: [ml-platform]
    volumes:
      - ./scripts/seaweedfs/create_buckets.py:/create_buckets.py
    entrypoint: /bin/sh
    command: >
      -c "
      set -x &&
      pip install --no-cache-dir boto3 python-dotenv &&
      python -u /create_buckets.py
      echo 'bucket init finished'
      "
    environment:
      SEAWEED_S3_ENDPOINT: http://seaweedfs-s3:8333
      SEAWEED_S3_BUCKETS: >
        ${MLFLOW_BUCKET_NAME},
        ${FEAST_OFFLINE_BUCKET},
        ${FEAST_REGISTRY_BUCKET},
        ${SP500COMPANIES},
        ${STREAMINGDATA_BUCKET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

  # --------------------
  # MLflow
  # --------------------
  mlflow:
    image: ${MLFLOW_IMAGE}
    container_name: mlflow
    restart: unless-stopped
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_MLFLOW_USER}:${POSTGRES_MLFLOW_PASSWORD}@postgres:5432/${POSTGRES_MLFLOW_DB}
      --host 0.0.0.0
      --serve-artifacts
      --artifacts-destination s3://${MLFLOW_BUCKET_NAME}/artifacts
      --default-artifact-root s3://${MLFLOW_BUCKET_NAME}/artifacts
      --port 5000
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      MLFLOW_S3_ENDPOINT_URL: http://seaweedfs-s3:8333
      MLFLOW_S3_IGNORE_TLS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs-bucket-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/2.0/mlflow/experiments/list"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mlflow.rule=Host(`${MLFLOW_DOMAIN}`)"
      - "traefik.http.routers.mlflow.entrypoints=websecure"
      - "traefik.http.routers.mlflow.tls.certresolver=le"
      - "traefik.http.routers.mlflow.middlewares=internal-auth@docker,edge-security@docker,edge-compress@docker"
      - "traefik.http.services.mlflow.loadbalancer.server.port=5000"
    networks: [ml-platform]

  # --------------------
  # Redis (online store + cache)
  # --------------------
  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks: [ml-platform]

  # --------------------
  # Spark Cluster
  # --------------------
  spark-master:
    image: ghcr.io/${GITHUB_REPOSITORY}/spark-streaming:${IMAGE_TAG}
    container_name: spark-master
    restart: unless-stopped
    command: >
      /opt/spark/bin/spark-class
      -javaagent:/opt/spark/jmx/jmx_prometheus_javaagent.jar=8090:/opt/spark/conf/jmx-spark.yaml
      org.apache.spark.deploy.master.Master
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_MODE: master
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ml-platform]
    depends_on:
      kafka-broker-1:
        condition: service_healthy
      kafka-broker-3:
        condition: service_healthy

  spark-worker-1:
    image: ghcr.io/${GITHUB_REPOSITORY}/spark-streaming:${IMAGE_TAG}
    container_name: spark-worker-1
    restart: unless-stopped
    command: >
      /opt/spark/bin/spark-class
      -javaagent:/opt/spark/jmx/jmx_prometheus_javaagent.jar=8091:/opt/spark/conf/jmx-spark.yaml
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    volumes:
      - spark_checkpoints:/opt/spark/checkpoints
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      SPARK_MODE: worker
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2G
      SPARK_NO_DAEMONIZE: "true"
      SPARK_HADOOP_FS_S3A_ENDPOINT: ${INTERNAL_SEAWEED_S3_ENDPOINT}
      SPARK_HADOOP_FS_S3A_ACCESS_KEY: ${AWS_ACCESS_KEY_ID}
      SPARK_HADOOP_FS_S3A_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY}
    networks: [ml-platform]

  spark-worker-2:
    image: ghcr.io/${GITHUB_REPOSITORY}/spark-streaming:${IMAGE_TAG}
    container_name: spark-worker-2
    restart: unless-stopped
    command: >
      /opt/spark/bin/spark-class
      -javaagent:/opt/spark/jmx/jmx_prometheus_javaagent.jar=8092:/opt/spark/conf/jmx-spark.yaml
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    volumes:
      - spark_checkpoints:/opt/spark/checkpoints
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      SPARK_MODE: worker
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2G
      SPARK_NO_DAEMONIZE: "true"
      SPARK_HADOOP_FS_S3A_ENDPOINT: ${INTERNAL_SEAWEED_S3_ENDPOINT}
      SPARK_HADOOP_FS_S3A_ACCESS_KEY: ${AWS_ACCESS_KEY_ID}
      SPARK_HADOOP_FS_S3A_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY}
    networks: [ml-platform]

  # Long-running streaming job service
  spark-streaming-service:
    image: ghcr.io/${GITHUB_REPOSITORY}/spark-streaming:${IMAGE_TAG}
    container_name: spark-streaming-service
    restart: unless-stopped
    profiles: ["manual-streaming"]
    depends_on:
      spark-master:
        condition: service_healthy
      kafka-broker-1:
        condition: service_healthy
      seaweedfs-s3:
        condition: service_started
    networks:
      - ml-platform
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: us-east-1
      SPARK_LOG_LEVEL: WARN
      STREAMING_CONFIG_PATH: /opt/app/polyhorizon/streaming/configs/spark_features.yaml
      SKIP_PREFLIGHT: "false"
      CLEAN_START: "false"
      DRY_RUN: "false"
    env_file:
      - .env.prod
    entrypoint: ["/opt/spark/bin/spark-submit"]
    command:
      - --master
      - spark://spark-master:7077
      - --deploy-mode
      - client
      - --name
      - polyhorizon-streaming-service
      - --supervise
      - --conf
      - spark.sql.streaming.checkpointLocation=s3a://polyhorizon-streamingdata/checkpoints/
      - --conf
      - spark.driver.memory=2g
      - --conf
      - spark.executor.memory=2g
      - --conf
      - spark.executor.cores=2
      - --conf
      - spark.cores.max=4
      - local:///opt/spark/jobs/streaming_job.py
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import json,urllib.request; apps=json.load(urllib.request.urlopen('http://spark-master:8080/json/')); print(any(app.get('name')=='polyhorizon-streaming-service' for app in apps.get('activeapps', [])))\" | grep True",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # --------------------
  # Prefect Server + Workers
  # --------------------
  prefect-server:
    image: ghcr.io/${GITHUB_REPOSITORY}/orchestration:${IMAGE_TAG}
    container_name: prefect
    command: prefect server start
    restart: unless-stopped
    volumes:
      - prefect_data:/root/.prefect
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_SERVER_DATABASE_CONNECTION_URL: postgresql+asyncpg://${POSTGRES_PREFECT_USER}:${POSTGRES_PREFECT_PASSWORD}@postgres:5432/${POSTGRES_PREFECT_DB}
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prefect.rule=Host(`${PREFECT_DOMAIN}`)"
      - "traefik.http.routers.prefect.entrypoints=websecure"
      - "traefik.http.routers.prefect.tls.certresolver=le"
      - "traefik.http.routers.prefect.middlewares=internal-auth@docker,edge-security@docker,edge-compress@docker"
      - "traefik.http.services.prefect.loadbalancer.server.port=4200"
    networks: [ml-platform]

  prefect-worker-training:
    image: ghcr.io/${GITHUB_REPOSITORY}/orchestration:${IMAGE_TAG}
    container_name: prefect-worker-training
    command: prefect worker start --pool training-docker-pool --type docker
    restart: unless-stopped
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_LOGGING_LEVEL: INFO
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      prefect-server:
        condition: service_started
    networks: [ml-platform]

  prefect-worker-features:
    image: ghcr.io/${GITHUB_REPOSITORY}/orchestration:${IMAGE_TAG}
    container_name: prefect-worker-features
    command: prefect worker start --pool features-docker-pool --type docker
    restart: unless-stopped
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_LOGGING_LEVEL: INFO
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      prefect-server:
        condition: service_started
    networks: [ml-platform]

  prefect-worker-ingestion:
    image: ghcr.io/${GITHUB_REPOSITORY}/orchestration:${IMAGE_TAG}
    container_name: prefect-worker-ingestion
    command: prefect worker start --pool ingestion-docker-pool --type docker
    restart: unless-stopped
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_LOGGING_LEVEL: INFO
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      prefect-server:
        condition: service_started
    networks: [ml-platform]

  prefect-worker-streaming:
    image: ghcr.io/${GITHUB_REPOSITORY}/orchestration:${IMAGE_TAG}
    container_name: prefect-worker-streaming
    command: prefect worker start --pool streaming-docker-pool --type docker
    restart: unless-stopped
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_LOGGING_LEVEL: INFO
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      prefect-server:
        condition: service_started
    networks: [ml-platform]

  # --------------------
  # Monitoring
  # --------------------
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      EVENTS: 1
      INFO: 1
      NETWORKS: 1
      PING: 1
      SERVICES: 1
      VERSION: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [ml-platform]

  loki:
    image: grafana/loki:3.7.2
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./monitoring/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks: [ml-platform]

  alloy:
    image: grafana/alloy:v1.16.1
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy.config:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      docker-socket-proxy:
        condition: service_started
      loki:
        condition: service_started
    networks: [ml-platform]

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=20GB
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/-/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`${PROMETHEUS_DOMAIN}`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls.certresolver=le"
      - "traefik.http.routers.prometheus.middlewares=internal-auth@docker,edge-security@docker,edge-compress@docker"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
    networks: [ml-platform]

  grafana:
    image: grafana/grafana:12.0.2
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`${GRAFANA_DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=le"
      - "traefik.http.routers.grafana.middlewares=internal-auth@docker,edge-security@docker,edge-compress@docker"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    networks: [ml-platform]
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: alertmanager
    restart: unless-stopped
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - ${ALERTMANAGER_SLACK_WEBHOOK_FILE:-./monitoring/secrets/alertmanager_slack_url.example}:/run/secrets/alertmanager_slack_url:ro
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--enable-feature=utf8-strict-mode"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9093/-/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alertmanager.rule=Host(`${ALERTMANAGER_DOMAIN}`)"
      - "traefik.http.routers.alertmanager.entrypoints=websecure"
      - "traefik.http.routers.alertmanager.tls.certresolver=le"
      - "traefik.http.routers.alertmanager.middlewares=internal-auth@docker,edge-security@docker,edge-compress@docker"
      - "traefik.http.services.alertmanager.loadbalancer.server.port=9093"
    networks: [ml-platform]

  prometheus-pushgateway:
    image: prom/pushgateway:v1.11.1
    container_name: prometheus-pushgateway
    restart: unless-stopped
    command:
      - --persistence.file=/data/metrics
      - --persistence.interval=5m
    volumes:
      - pushgateway_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9091/-/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [ml-platform]

  # --------------------
  # Model Serving + Frontend
  # --------------------
  model-serving:
    image: ghcr.io/${GITHUB_REPOSITORY}/serving:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      SERVING_CONFIG_PATH: /app/polyhorizon/serving/configs/serving_config.yaml
      FEAST_REPO_PATH: /app/polyhorizon/features/feature_repo
      FEAST_STORE_YAML: /app/polyhorizon/features/feature_repo/feature_store.yaml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/v1/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.serving.rule=Host(`${POLYHORIZON_DOMAIN}`) && PathPrefix(`/v1`)"
      - "traefik.http.routers.serving.entrypoints=websecure"
      - "traefik.http.routers.serving.tls.certresolver=le"
      - "traefik.http.routers.serving.priority=10"
      - "traefik.http.routers.serving.middlewares=edge-security@docker,api-ratelimit@docker,api-inflight@docker,edge-compress@docker"
      - "traefik.http.services.serving.loadbalancer.server.port=8000"
    networks: [ml-platform]

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY}/frontend:${IMAGE_TAG}
    container_name: polyhorizon-frontend
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${POLYHORIZON_DOMAIN}`) && PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=le"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.routers.frontend.middlewares=edge-security@docker,edge-compress@docker"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [ml-platform]

  # --------------------
  # Traefik
  # --------------------
  traefik:
    image: traefik:v3.7.1
    container_name: traefik
    restart: unless-stopped
    command:
      - --api.dashboard=true
      - --api.insecure=false
      - --ping=true
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://docker-socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.metrics.address=:8082
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --accesslog=true
      - --accesslog.format=json
      - --accesslog.bufferingsize=100
      - --accesslog.fields.headers.defaultmode=drop
      - --accesslog.fields.headers.names.User-Agent=keep
      - --accesslog.fields.headers.names.Authorization=redact
      - --accesslog.fields.headers.names.X-API-Key=redact
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
      - --metrics.prometheus.addrouterslabels=true
      - --metrics.prometheus.addserviceslabels=true
      - --certificatesresolvers.le.acme.email=${TRAEFIK_ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik_data:/letsencrypt
    depends_on:
      docker-socket-proxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`${TRAEFIK_DASHBOARD_DOMAIN}`)"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls.certresolver=le"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.middlewares=dashboard-auth,edge-security@docker,edge-compress@docker"
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_DASHBOARD_USERS}"
      - "traefik.http.middlewares.internal-auth.basicauth.users=${TRAEFIK_DASHBOARD_USERS}"
      - "traefik.http.middlewares.edge-security.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.edge-security.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.edge-security.headers.stsPreload=true"
      - "traefik.http.middlewares.edge-security.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.edge-security.headers.browserXssFilter=true"
      - "traefik.http.middlewares.edge-security.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.edge-security.headers.permissionsPolicy=camera=(), microphone=(), geolocation=()"
      - "traefik.http.middlewares.api-ratelimit.ratelimit.average=${TRAEFIK_API_RATE_LIMIT_AVERAGE:-60}"
      - "traefik.http.middlewares.api-ratelimit.ratelimit.burst=${TRAEFIK_API_RATE_LIMIT_BURST:-30}"
      - "traefik.http.middlewares.api-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.api-inflight.inflightreq.amount=${TRAEFIK_API_MAX_INFLIGHT:-32}"
      - "traefik.http.middlewares.edge-compress.compress=true"
      - "traefik.tls.options.default.minVersion=VersionTLS12"
      - "traefik.tls.options.default.sniStrict=true"
    networks: [ml-platform]
