global:
  resolve_timeout: 5m
  slack_api_url_file: /run/secrets/alertmanager_slack_url

route:
  receiver: "default-notifications"
  group_by: ["alertname", "service", "environment"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h

  routes:
    # Critical infrastructure alerts
    - matchers:
        - severity="critical"
      receiver: "critical-notifications"
      repeat_interval: 30m

    # ML pipeline alerts (non-paging)
    - matchers:
        - category="polyhorizon-pipeline"
      receiver: "polyhorizon-pipeline-notifications"
      repeat_interval: 2h

    # Kafka / Streaming warnings
    - matchers:
        - category="streaming"
      receiver: "streaming-notifications"
      repeat_interval: 1h

receivers:
  - name: "default-notifications"
    slack_configs:
      - channel: "#polyhorizon-platform-alerts"
        send_resolved: true
        title: "{{ .CommonAnnotations.summary }}"
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.description }}
          *StartsAt:* {{ .StartsAt }}
          {{ end }}

  - name: "critical-notifications"
    slack_configs:
      - channel: "#polyhorizon-platform-critical"
        send_resolved: true
        title: "CRITICAL: {{ .CommonAnnotations.summary }}"
        text: >-
          {{ range .Alerts }}
          *Service:* {{ .Labels.service }}
          *Description:* {{ .Annotations.description }}
          *Started:* {{ .StartsAt }}
          {{ end }}

  - name: "polyhorizon-pipeline-notifications"
    slack_configs:
      - channel: "#polyhorizon-platform-ml"
        send_resolved: true
        title: "polyhorizon Pipeline Alert"
        text: >-
          {{ range .Alerts }}
          *Job:* {{ .Labels.job }}
          *Issue:* {{ .Annotations.description }}
          {{ end }}

  - name: "streaming-notifications"
    slack_configs:
      - channel: "#polyhorizon-platform-streaming"
        send_resolved: true
        title: "polyhorizon Streaming Alert"
        text: >-
          {{ range .Alerts }}
          *Broker:* {{ .Labels.instance }}
          *Issue:* {{ .Annotations.description }}
          {{ end }}

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ["alertname", "service"]
