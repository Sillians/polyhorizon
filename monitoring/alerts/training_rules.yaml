groups:
  - name: training.rules
    rules:
      - alert: TrainingRunFailed
        expr: training_last_run_success == 0
        for: 15m
        labels:
          severity: warning
          service: training
          category: polyhorizon-pipeline
        annotations:
          summary: "Training run failed"
          description: "Most recent training run reported failure."

      - alert: TrainingRunStale
        expr: time() - training_last_run_timestamp > 7776000
        for: 1h
        labels:
          severity: warning
          service: training
          category: polyhorizon-pipeline
        annotations:
          summary: "Training run overdue"
          description: "No training run detected in the last 90 days."

      - alert: TrainingMetricsMissing
        expr: absent(training_last_run_timestamp)
        for: 30m
        labels:
          severity: info
          service: training
          category: polyhorizon-pipeline
        annotations:
          summary: "Training metrics missing"
          description: "Prometheus has not received training run metrics."
